name: doc_scanner_sdk
description: Flutter wrapper for DocScanner native SDKs. White crop-rectangle overlay and crop-on-capture live in native code (Android/iOS/macOS); this package only bridges them.
version: 1.0.0
homepage: https://github.com/Tareq-Ghassan/DocumentScanner-SDK
repository: https://github.com/Tareq-Ghassan/DocScannerSDK-Flutter
issue_tracker: https://github.com/Tareq-Ghassan/DocScannerSDK-Flutter/issues
documentation: https://github.com/Tareq-Ghassan/DocScannerSDK-Flutter/blob/main/README.md

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.docscanner.flutter
        pluginClass: DocScannerSdkPlugin
      ios:
        pluginClass: DocScannerSdkPlugin
      web:
        pluginClass: DocScannerSdkWeb
        fileName: doc_scanner_sdk_web.dart
      macos:
        pluginClass: DocScannerSdkPlugin
      windows:
        pluginClass: DocScannerSdkPluginCApi
      linux:
        pluginClass: DocScannerSdkPlugin

topics:
  - scanner
  - camera
  - document
  - cropping
  - id-card

funding:
  - https://github.com/sponsors/Tareq-Ghassan
